{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto;">
  <div class="card">
    <div class="card-header">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h2>Set New Password</h2>
    </div>
    {% if current_user.must_change_password %}
    <div class="alert alert-error" style="margin-bottom:16px;">You must change your temporary password before continuing.</div>
    {% endif %}
    <form method="post" action="/auth/change-password" class="auth-form" style="gap:16px;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" required minlength="8" placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Save New Password</button>
    </form>
  </div>
</div>
{% endblock %}
