version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_app
    restart: always
    environment:
      # Use External URL locally (the internal host won't resolve outside Render)
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      PORT: ${PORT:-8091}
    ports:
      - "8091:8091"
    volumes:
      - ./uploads:/app/uploads