# ===============================
# Application
# ===============================
spring.application.name=football-academy

# ===============================
# Server
# ===============================
server.port=8091

# ===============================
# MySQL Database (SEEDed)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/seeded_football_academy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# IMPORTANT:
# ? Use validate or none when DB is already seeded
# ? Use update to fix schema mismatches
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Disable H2 completely
# ===============================
spring.h2.console.enabled=false

# ===============================
# JWT
# ===============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===============================
# Stripe (dev / dummy)
# ===============================
stripe.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Email / SMTP (password reset + support)
# ===============================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:boufaiedmortadha7@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:boufaiedmortadha7@gmail.com}
app.mail.support-to=${SUPPORT_EMAIL:boufaiedmortadha7@gmail.com}

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.prefix=classpath:/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# ===============================
# Web
# ===============================
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=true

# ===============================
# DevTools
# ===============================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
