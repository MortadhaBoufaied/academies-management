<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${match != null and match.id != null ? 'Edit Match' : 'New Match'} + ' - Football Academy'">Match Form</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('activities')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar(${match != null and match.id != null ? 'Edit Match' : 'New Match'})"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <section class="rounded-3xl bg-gradient-to-r from-emerald-700 via-emerald-600 to-teal-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-emerald-200">Matches</p>         <h2 class="mt-2 text-3xl font-black" th:text="${match != null and match.id != null ? 'Edit Match' : 'Schedule Match'}">Match</h2>       </section>        <form th:action="${match != null and match.id != null} ? @{/admin/activities/{id}(id=${match.id})} : @{/admin/activities}"             method="post" class="mt-6 grid gap-6 xl:grid-cols-3">         <input type="hidden" name="type" value="MATCH">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">         <section class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <div class="grid gap-5 sm:grid-cols-2">             <div class="sm:col-span-2">               <label for="titre" class="mb-1.5 block text-sm font-semibold text-slate-700">Title</label>               <input id="titre" name="titre" required th:value="${match?.titre}" placeholder="Academy vs Opponent" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="date" class="mb-1.5 block text-sm font-semibold text-slate-700">Date</label>               <input id="date" name="date" type="date" required th:value="${match?.date != null ? #temporals.format(match.date,'yyyy-MM-dd') : ''}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="lieu" class="mb-1.5 block text-sm font-semibold text-slate-700">Location</label>               <input id="lieu" name="lieu" required th:value="${match?.lieu}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="opponent" class="mb-1.5 block text-sm font-semibold text-slate-700">Opponent</label>               <input id="opponent" name="opponent" th:value="${match?.opponent}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="result" class="mb-1.5 block text-sm font-semibold text-slate-700">Result</label>               <input id="result" name="result" th:value="${match?.result}" placeholder="Pending, 2-1, 0-0" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="trainerId" class="mb-1.5 block text-sm font-semibold text-slate-700">Trainer</label>               <select id="trainerId" name="trainerId" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="">No trainer</option>                 <option th:each="trainer : ${trainers}" th:value="${trainer.id}" th:text="${trainer.user != null ? trainer.user.nom : 'Trainer ' + trainer.id}" th:selected="${match?.trainerId == trainer.id}">Trainer</option>               </select>             </div>             <div class="sm:col-span-2">               <label for="description" class="mb-1.5 block text-sm font-semibold text-slate-700">Description</label>               <textarea id="description" name="description" rows="4" th:text="${match?.description}" class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>           </div>         </section>         <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <button type="submit" class="w-full rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-700">Save Match</button>           <a th:href="@{/admin/view/activities/matches}" class="mt-3 block rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>         </aside>       </form>     </main>   </div> </div> </body> </html>
