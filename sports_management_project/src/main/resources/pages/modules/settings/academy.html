<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Academy Settings</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('settings')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Academy Settings')"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <div th:if="${param.saved}" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800">Academy settings saved.</div>       <section class="rounded-3xl bg-gradient-to-r from-emerald-700 via-emerald-600 to-teal-600 p-8 text-white shadow-xl">         <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">           <div>             <p class="text-xs font-bold uppercase tracking-[0.4em] text-emerald-200">Settings</p>             <h2 class="mt-2 text-3xl font-black">Academy Information</h2>           </div>           <button id="editAcademyButton" type="button"                   class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-bold text-slate-800 shadow transition hover:bg-slate-100">             <span class="material-symbols-outlined text-[16px]">edit</span>             Edit           </button>         </div>       </section>        <form id="academySettingsForm" th:action="@{/admin/academy-info}" method="post" class="mt-6 grid gap-6 xl:grid-cols-3">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">         <section class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <div class="grid gap-5 sm:grid-cols-2">             <div>               <label class="mb-1.5 block text-sm font-semibold text-slate-700">Academy ID</label>               <div class="flex min-h-12 items-center rounded-2xl border border-slate-200 bg-slate-100 px-4 py-3 text-sm font-black text-slate-700"                    th:text="${currentAcademy != null ? currentAcademy.id : 'Not assigned'}">1</div>             </div>             <div>               <label for="nom" class="mb-1.5 block text-sm font-semibold text-slate-700">Academy Name</label>               <input id="nom" name="nom" th:value="${academyInfo?.nom}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="slogan" class="mb-1.5 block text-sm font-semibold text-slate-700">Slogan</label>               <input id="slogan" name="slogan" th:value="${academyInfo?.slogan}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div class="sm:col-span-2">               <label for="description" class="mb-1.5 block text-sm font-semibold text-slate-700">Description</label>               <textarea id="description" name="description" rows="4" th:text="${academyInfo?.description}" class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>             <div>               <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700">Email</label>               <input id="email" name="email" type="email" th:value="${academyInfo?.email}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="phone" class="mb-1.5 block text-sm font-semibold text-slate-700">Phone</label>               <input id="phone" name="phone" th:value="${academyInfo?.phone}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="website" class="mb-1.5 block text-sm font-semibold text-slate-700">Website</label>               <input id="website" name="website" th:value="${academyInfo?.website}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="foundedYear" class="mb-1.5 block text-sm font-semibold text-slate-700">Founded Year</label>               <input id="foundedYear" name="foundedYear" type="number" th:value="${academyInfo?.foundedYear}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div class="sm:col-span-2">               <label for="address" class="mb-1.5 block text-sm font-semibold text-slate-700">Address</label>               <input id="address" name="address" th:value="${academyInfo?.address}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="city" class="mb-1.5 block text-sm font-semibold text-slate-700">City</label>               <input id="city" name="city" th:value="${academyInfo?.city}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="country" class="mb-1.5 block text-sm font-semibold text-slate-700">Country</label>               <input id="country" name="country" th:value="${academyInfo?.country}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div class="sm:col-span-2">               <label for="mission" class="mb-1.5 block text-sm font-semibold text-slate-700">Mission</label>               <textarea id="mission" name="mission" rows="3" th:text="${academyInfo?.mission}" class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>           </div>         </section>         <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <p id="academyEditState" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-600">             View-only mode. Click Edit to make changes.           </p>           <button id="saveAcademyButton" type="submit" disabled class="w-full rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white opacity-50 hover:bg-emerald-700 disabled:cursor-not-allowed">Save Settings</button>           <a th:href="@{/admin/view/dashboard}" class="mt-3 block rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Dashboard</a>         </aside>       </form>      </main>   </div> </div> <script>   (() => {     const form = document.getElementById('academySettingsForm');     const editButton = document.getElementById('editAcademyButton');     const saveButton = document.getElementById('saveAcademyButton');     const state = document.getElementById('academyEditState');     const fields = form ? Array.from(form.querySelectorAll('input:not([type="hidden"]), textarea')) : [];      const setEditable = (editable) => {       fields.forEach((field) => {         field.disabled = !editable;         field.classList.toggle('opacity-70', !editable);         field.classList.toggle('cursor-not-allowed', !editable);       });       if (saveButton) {         saveButton.disabled = !editable;         saveButton.classList.toggle('opacity-50', !editable);       }       if (editButton) {         editButton.classList.toggle('hidden', editable);       }       if (state) {         state.textContent = editable ? 'Editing enabled. Save when finished.' : 'View-only mode. Click Edit to make changes.';       }     };      setEditable(false);     if (editButton) {       editButton.addEventListener('click', () => setEditable(true));     }   })(); </script> </body> </html>
