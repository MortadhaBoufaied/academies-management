<div th:fragment="controls(pagination)"      th:if="${pagination != null and pagination.totalItems > 0}"      class="mt-4 flex flex-col gap-3 border-t border-slate-100 px-6 py-4 sm:flex-row sm:items-center sm:justify-between">   <p class="text-sm text-slate-500">     Showing     <span class="font-black text-slate-900" th:text="${pagination.fromItem}">1</span>     -     <span class="font-black text-slate-900" th:text="${pagination.toItem}">20</span>     of     <span class="font-black text-slate-900" th:text="${pagination.totalItems}">0</span>   </p>    <div th:if="${pagination.totalPages > 1}" class="flex flex-wrap items-center gap-2">     <a th:href="${pagination.hasPrevious ? pagination.previousHref : '#'}"        th:classappend="${!pagination.hasPrevious} ? ' pointer-events-none opacity-40' : ''"        class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-black text-slate-700 hover:bg-slate-50">       Prev     </a>      <a th:each="link : ${pagination.pageLinks}"        th:href="${link.href}"        th:text="${link.label}"        th:classappend="${link.active} ? ' border-slate-900 bg-slate-900 text-white' : ' border-slate-200 bg-white text-slate-700 hover:bg-slate-50'"        class="inline-flex min-w-10 items-center justify-center rounded-xl border px-3 py-2 text-xs font-black">1</a>      <a th:href="${pagination.hasNext ? pagination.nextHref : '#'}"        th:classappend="${!pagination.hasNext} ? ' pointer-events-none opacity-40' : ''"        class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-black text-slate-700 hover:bg-slate-50">       Next     </a>   </div> </div>
