<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${pageTitle}">Category</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div th:replace="pages/modules/layouts/base :: layout(~{::content}, ${activeMenu}, ${pageTitle})">   <section th:fragment="content" class="space-y-6">      <div th:if="${error}" class="flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">       <span class="material-symbols-outlined text-[18px]">error</span> <span th:text="${error}">Error</span>     </div>      <section class="rounded-3xl bg-gradient-to-r from-indigo-700 via-violet-600 to-fuchsia-600 p-8 text-white shadow-xl">       <p class="text-xs font-black uppercase tracking-[0.4em] text-indigo-100">Catalog</p>       <h2 class="mt-2 text-3xl font-black" th:text="${category != null and category.id != null} ? 'Edit Category' : 'New Category'">New Category</h2>       <p class="mt-1 text-sm text-indigo-50/90">Category codes are unique per sport.</p>     </section>      <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">       <form th:action="${category != null and category.id != null} ? @{/super-admin/sport-categories/{id}(id=${category.id})} : @{/super-admin/sport-categories}"             method="post" class="grid gap-5 md:grid-cols-2">          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Sport</label>           <select name="sportId" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">             <option value="">Ã¢â‚¬â€ None Ã¢â‚¬â€</option>             <option th:each="s : ${sports}" th:value="${s.id}" th:selected="${sportId != null and sportId == s.id}" th:text="${s.name}">Sport</option>           </select>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Code</label>           <input name="code" required class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  th:value="${category.code}" placeholder="U18">         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Name</label>           <input name="name" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  th:value="${category.name}" placeholder="Under 18">         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Display Order</label>           <input type="number" name="displayOrder" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  th:value="${category.displayOrder}">         </div>          <div class="md:col-span-2">           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Description</label>           <textarea name="description" rows="3" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                     th:text="${category.description}"></textarea>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Active</label>           <select name="isActive" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">             <option value="true" th:selected="${category.isActive == null or category.isActive}">Yes</option>             <option value="false" th:selected="${category.isActive != null and !category.isActive}">No</option>           </select>         </div>          <div class="md:col-span-2 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">           <a th:href="@{/super-admin/sport-categories/list}" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-black text-slate-700 hover:bg-slate-50">             Back to list           </a>           <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-indigo-700 px-5 py-2.5 text-sm font-black text-white hover:bg-indigo-800">             Save Category           </button>         </div>       </form>     </section>   </section> </div> </body> </html>
