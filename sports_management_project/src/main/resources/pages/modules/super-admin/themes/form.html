<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${pageTitle}">Theme</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div th:replace="pages/modules/layouts/base :: layout(~{::content}, ${activeMenu}, ${pageTitle})">   <section th:fragment="content" class="space-y-6">      <div th:if="${error}" class="flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">       <span class="material-symbols-outlined text-[18px]">error</span> <span th:text="${error}">Error</span>     </div>      <section class="rounded-3xl bg-gradient-to-r from-teal-700 via-emerald-600 to-amber-500 p-8 text-white shadow-xl">       <p class="text-xs font-black uppercase tracking-[0.4em] text-emerald-100">Mobile</p>       <h2 class="mt-2 text-3xl font-black" th:text="${theme != null and theme.id != null} ? 'Edit Theme' : 'New Theme'">New Theme</h2>       <p class="mt-1 text-sm text-emerald-50/90">Use hex colors (e.g. #0f766e). Saving creates a new version.</p>     </section>      <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">       <form th:action="${theme != null and theme.id != null} ? @{/super-admin/themes/{id}(id=${theme.id})} : @{/super-admin/themes}"             method="post" class="grid gap-5 lg:grid-cols-3">          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Scope</label>           <select name="scope" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">             <option value="PLATFORM_DEFAULT" th:selected="${theme.scope != null and theme.scope.name() == 'PLATFORM_DEFAULT'}">PLATFORM_DEFAULT</option>             <option value="GLOBAL" th:selected="${theme.scope == null or theme.scope.name() == 'GLOBAL'}">GLOBAL</option>             <option value="ACADEMY" th:selected="${theme.scope != null and theme.scope.name() == 'ACADEMY'}">ACADEMY (advanced)</option>           </select>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Sport</label>           <select name="sportId" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">             <option value="">Ã¢â‚¬â€ None Ã¢â‚¬â€</option>             <option th:each="s : ${sports}" th:value="${s.id}" th:selected="${sportId != null and sportId == s.id}" th:text="${s.name}">Sport</option>           </select>           <p class="mt-2 text-xs font-semibold text-slate-500">If set, this theme becomes the sportÃ¢â‚¬â„¢s current theme.</p>         </div>          <div class="lg:col-span-1">           <div class="rounded-2xl bg-slate-50 p-4">             <p class="text-xs font-black uppercase tracking-[0.2em] text-slate-500">Current Version</p>             <p class="mt-2 text-2xl font-black text-slate-900" th:text="${theme.version ?: 0}">0</p>             <p class="mt-1 text-xs font-semibold text-slate-500">Saving will increment version.</p>           </div>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Primary</label>           <input name="primaryColor" th:value="${theme.primaryColor}" placeholder="#0f766e"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>         <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Secondary</label>           <input name="secondaryColor" th:value="${theme.secondaryColor}" placeholder="#065f46"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>         <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Accent</label>           <input name="accentColor" th:value="${theme.accentColor}" placeholder="#f59e0b"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Background</label>           <input name="backgroundColor" th:value="${theme.backgroundColor}" placeholder="#f8fafc"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>         <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Text</label>           <input name="textColor" th:value="${theme.textColor}" placeholder="#0f172a"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>         <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Font Family</label>           <input name="fontFamily" th:value="${theme.fontFamily}" placeholder="Public Sans"                  class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">         </div>          <div class="lg:col-span-3 grid gap-5 md:grid-cols-2">           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Logo URL</label>             <input name="logoUrl" th:value="${theme.logoUrl}" placeholder="/uploads/... or https://..."                    class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Home Banner URL</label>             <input name="homeBannerUrl" th:value="${theme.homeBannerUrl}"                    class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Default Player Image</label>             <input name="defaultPlayerImageUrl" th:value="${theme.defaultPlayerImageUrl}"                    class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Splash Image URL</label>             <input name="splashImageUrl" th:value="${theme.splashImageUrl}"                    class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold">           </div>         </div>          <div class="lg:col-span-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">           <a th:href="@{/super-admin/themes/list}" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-black text-slate-700 hover:bg-slate-50">             Back to list           </a>           <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-black text-white hover:bg-teal-800">             Save Theme           </button>         </div>       </form>     </section>   </section> </div> </body> </html>
