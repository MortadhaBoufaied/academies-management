]">error</span> <span th:text="${error}">Error</span>     </div>      <section class="rounded-3xl bg-gradient-to-r from-teal-700 via-emerald-600 to-amber-500 p-8 text-white shadow-xl">       <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">         <div>           <p class="text-xs font-black uppercase tracking-[0.4em] text-emerald-100">Mobile</p>           <h2 class="mt-2 text-3xl font-black">Themes</h2>           <p class="mt-1 text-sm text-emerald-50/90">Theme versions consumed by the Flutter app (platform, global, and academy scopes).</p>         </div>         <a th:href="@{/super-admin/themes/new}" class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-black text-teal-800 shadow hover:bg-emerald-50">           <span class="material-symbols-outlined text-[18px]">add_circle</span> New Theme         </a>       </div>     </section>      <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">       <div th:if="${themes == null or #lists.isEmpty(themes)}"            class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-8 text-center text-sm font-semibold text-slate-500">         No themes yet.       </div>        <div th:if="${themes != null and not #lists.isEmpty(themes)}" class="overflow-hidden rounded-2xl border border-slate-200">         <table class="min-w-full divide-y divide-slate-200 text-sm">           <thead class="bg-slate-50">           <tr>             <th class="px-4 py-3 text-left text-xs font-black uppercase tracking-[0.2em] text-slate-500">Scope</th>             <th class="px-4 py-3 text-left text-xs font-black uppercase tracking-[0.2em] text-slate-500">Sport</th>             <th class="px-4 py-3 text-left text-xs font-black uppercase tracking-[0.2em] text-slate-500">Version</th>             <th class="px-4 py-3 text-left text-xs font-black uppercase tracking-[0.2em] text-slate-500">Palette</th>             <th class="px-4 py-3 text-right text-xs font-b
