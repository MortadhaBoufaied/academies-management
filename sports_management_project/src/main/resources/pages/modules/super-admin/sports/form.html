<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${pageTitle}">Sport</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div th:replace="~{pages/modules/layouts/base :: layout(~{::content}, ${activeMenu}, ${pageTitle})}">   <section th:fragment="content" class="space-y-6">      <div th:if="${error}" class="flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">       <span class="material-symbols-outlined text-[18px]">error</span> <span th:text="${error}">Error</span>     </div>      <section class="rounded-3xl bg-gradient-to-r from-emerald-700 via-teal-600 to-sky-600 p-8 text-white shadow-xl">       <p class="text-xs font-black uppercase tracking-[0.4em] text-emerald-100">Catalog</p>       <h2 class="mt-2 text-3xl font-black" th:text="${sportForm != null and sportForm.id != null} ? 'Edit Sport' : 'New Sport'">New Sport</h2>       <p class="mt-1 text-sm text-emerald-50/90">Create the sport, define its theme, and bootstrap its core divisions in one workflow.</p>     </section>      <form th:action="${sportForm != null and sportForm.id != null} ? @{/super-admin/sports/{id}(id=${sportForm.id})} : @{/super-admin/sports}"           method="post"           class="grid gap-6 md:grid-cols-2">       <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"              th:value="${_csrf != null ? _csrf.token : ''}">       <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Code</label>           <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  name="code" th:value="${sportForm.code}" placeholder="FOOTBALL" required>           <p class="mt-2 text-xs font-semibold text-slate-500">Unique identifier, stored uppercase.</p>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Name</label>           <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  name="name" th:value="${sportForm.name}" placeholder="Football" required>         </div>          <div class="md:col-span-2">           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Description</label>           <textarea class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                     name="description" rows="3" th:text="${sportForm.description}"></textarea>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Active</label>           <select class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                   name="isActive">             <option value="true" th:selected="${sportForm.isActive == null or sportForm.isActive}">Yes</option>             <option value="false" th:selected="${sportForm.isActive != null and !sportForm.isActive}">No</option>           </select>         </div>          <div>           <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Display Order</label>           <input type="number" class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                  name="displayOrder" th:value="${sportForm.displayOrder}" placeholder="0">         </div>       </section>        <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">         <div class="mb-5">           <p class="text-xs font-black uppercase tracking-[0.25em] text-violet-600">Theme</p>           <h3 class="mt-2 text-xl font-black text-slate-900">Sport identity</h3>           <p class="mt-1 text-sm text-slate-500">Each academy using this sport inherits this visual theme.</p>         </div>          <input type="hidden" name="theme.id" th:value="${sportForm.theme != null ? sportForm.theme.id : ''}">          <div class="grid gap-5 md:grid-cols-2">           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Primary Color</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.primaryColor" th:value="${sportForm.theme != null ? sportForm.theme.primaryColor : ''}" placeholder="#0f766e">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Secondary Color</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.secondaryColor" th:value="${sportForm.theme != null ? sportForm.theme.secondaryColor : ''}" placeholder="#065f46">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Accent Color</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.accentColor" th:value="${sportForm.theme != null ? sportForm.theme.accentColor : ''}" placeholder="#f59e0b">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Background Color</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.backgroundColor" th:value="${sportForm.theme != null ? sportForm.theme.backgroundColor : ''}" placeholder="#f8fafc">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Text Color</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.textColor" th:value="${sportForm.theme != null ? sportForm.theme.textColor : ''}" placeholder="#0f172a">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Font Family</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.fontFamily" th:value="${sportForm.theme != null ? sportForm.theme.fontFamily : ''}" placeholder="Public Sans">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Logo URL</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.logoUrl" th:value="${sportForm.theme != null ? sportForm.theme.logoUrl : ''}" placeholder="/uploads/... or https://...">           </div>           <div>             <label class="block text-xs font-black uppercase tracking-[0.2em] text-slate-500">Banner URL</label>             <input class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold"                    name="theme.homeBannerUrl" th:value="${sportForm.theme != null ? sportForm.theme.homeBannerUrl : ''}" placeholder="/uploads/banner.png">           </div>         </div>       </section>        <div th:replace="~{pages/modules/super-admin/sports/divisions-module :: editor(${sportForm.divisions})}"></div>        <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm md:col-span-2">         <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">           <a th:href="@{/super-admin/sports/list}" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-black text-slate-700 hover:bg-slate-50">             Back to list           </a>           <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-emerald-700 px-5 py-2.5 text-sm font-black text-white hover:bg-emerald-800">             <span th:text="${sportForm != null and sportForm.id != null} ? 'Save Sport & Divisions' : 'Create Sport & Divisions'">Save Sport</span>           </button>         </div>       </section>     </form>    </section> </div> </body> </html>
