<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Bot Knowledge</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('chatbot')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Bot Knowledge')"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <div th:if="${param.seeded}" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800">Knowledge seed completed.</div>       <div th:if="${param.deleted}" class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">Knowledge item deleted.</div>       <div th:if="${param.cleared}" class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">Knowledge base cleared.</div>        <section class="rounded-3xl bg-gradient-to-r from-cyan-700 via-sky-600 to-indigo-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-cyan-100">Chatbot</p>         <h2 class="mt-2 text-3xl font-black">Knowledge Base</h2>       </section>        <section class="mt-6 grid gap-6 xl:grid-cols-[2fr,1fr]">         <div class="rounded-3xl border border-slate-200 bg-white shadow-sm">           <div class="border-b border-slate-100 px-6 py-4">             <h3 class="text-lg font-black text-slate-900">Knowledge Items</h3>           </div>           <div th:if="${chatbotData == null or #lists.isEmpty(chatbotData)}" class="px-6 py-12 text-center text-sm font-semibold text-slate-500">             No chatbot knowledge items are available yet.           </div>           <div th:if="${chatbotData != null and not #lists.isEmpty(chatbotData)}" class="divide-y divide-slate-100">             <article th:each="item : ${chatbotData}" class="px-6 py-4">               <div class="flex items-start justify-between gap-4">                 <div>                   <p class="font-bold text-slate-900" th:text="${item.question ?: item.fileName ?: 'Knowledge item'}">Knowledge item</p>                   <p class="mt-1 text-sm text-slate-600" th:text="${item.answer ?: item.tags ?: item.filePath ?: 'No preview available.'}">Preview</p>                 </div>                 <form th:action="@{/admin/chatbot-data/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this knowledge item?')">                   <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">                   <button class="rounded-xl border border-red-200 bg-red-50 px-3 py-1.5 text-xs font-bold text-red-700 hover:bg-red-100">Delete</button>                 </form>               </div>             </article>           </div>         </div>          <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <form th:action="@{/admin/chatbot-data/seed}" method="post">             <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">             <button class="w-full rounded-2xl bg-cyan-600 px-5 py-3 text-sm font-bold text-white hover:bg-cyan-700">Seed Knowledge</button>           </form>           <form th:action="@{/admin/chatbot-data/clear}" method="post" class="mt-3" onsubmit="return confirm('Clear all chatbot knowledge?')">             <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">             <button class="w-full rounded-2xl border border-red-200 bg-red-50 px-5 py-3 text-sm font-bold text-red-700 hover:bg-red-100">Clear Knowledge</button>           </form>           <a th:href="@{/admin/view/chatbot}" class="mt-3 block rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Open Console</a>         </aside>       </section>     </main>   </div> </div> </body> </html>
