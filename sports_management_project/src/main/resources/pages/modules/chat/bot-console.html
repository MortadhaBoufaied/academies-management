<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Bot Console</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 font-['Public_Sans'] antialiased">   <div class="min-h-screen">     <div th:replace="pages/modules/components/sidebar :: sidebar('chat')"></div>     <div class="min-h-screen lg:pl-72">       <div th:replace="pages/modules/components/navbar :: navbar('Bot Console')"></div>       <main class="px-4 py-6 sm:px-6 lg:px-8"><section class="rounded-3xl bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 p-8 text-white shadow-xl"><p class="text-xs font-semibold uppercase tracking-[0.35em] text-emerald-100">Assistant</p><h2 class="mt-3 text-3xl font-black">Bot Console</h2><p class="mt-3 max-w-2xl text-sm text-emerald-50">Use this quick console to ask the chatbot a question or add extra context before you send it.</p></section><section class="mt-6 max-w-3xl"><div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><h3 class="text-xl font-black text-slate-900">Ask a question</h3><form th:action="@{/admin/chatbot/ask}" method="post" class="mt-6 space-y-4"><input name="question" class="w-full rounded-2xl border-slate-200" placeholder="Type your question"><textarea name="context" rows="6" class="w-full rounded-3xl border-slate-200" placeholder="Optional context"></textarea><button class="rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white">Send</button></form></div></section></main>     </div>   </div> </body> </html>
