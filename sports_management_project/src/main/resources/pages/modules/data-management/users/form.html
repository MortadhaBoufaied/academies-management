.4em] text-slate-400">Users</p>         <h2 class="mt-2 text-3xl font-black"             th:text="${user != null and user.id != null ? 'Edit User Account' : 'Create New User'}">User</h2>       </section>        <div th:if="${error}" class="mt-4 flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">         <span class="material-symbols-outlined text-[18px]">error</span>         <span th:text="${error}">Error.</span>       </div>        <form th:action="${user != null and user.id != null} ? @{/admin/users/{id}(id=${user.id})} : @{/admin/users}"             method="post"             id="user-form"             class="mt-6 grid gap-6 xl:grid-cols-3">          <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>          <!-- Main fields -->         <div class="col-span-2 flex flex-col gap-6">            <!-- Basic Info -->           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="flex items-center gap-2 text-base font-black text-slate-900">               <span class="material-symbols-outlined text-slate-600">person</span> Account Info             </h3>             <div class="mt-5 grid gap-5 sm:grid-cols-2">                <div class="sm:col-span-2">                 <label for="nom" class="mb-1.5 block text-sm font-semibold text-slate-700">Full Name <span class="text-red-500">*</span></label>                 <input type="text" id="nom" name="nom" required                        th:value="${user?.nom}"                        placeholder="Full name"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-slate-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400/20">               </div>                <div>                 <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700" ame="profilePhotoUrl"                        th:value="${user?.profilePhotoUrl}"                        placeholder="https://Ã¢â‚¬Â¦"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-slate-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400/20">               </div>                <div class="sm:col-span-2">                 <label for="bio" class="mb-1.5 block text-sm font-semibold text-slate-700">Bio</label>                 <textarea id="bio" name="bio" rows="3"                           th:text="${user?.bio}"                           placeholder="Short bioÃ¢â‚¬Â¦"                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-slate-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400/20 resize-none"></textarea>               </div>              </div>           </div>          </div>          <!-- Sidebar actions -->         <div class="flex flex-col gap-6">           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="text-base font-black text-slate-900">Actions</h3>             <div class="mt-4 flex flex-col gap-3">               <button type="submit" id="btn-save-user"                       class="flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-800 px-5 py-3 text-sm font-bold text-white shadow hover:bg-slate-900">                 <span class="material-symbols-outlined text-[18px]">save</span>                 <span th:text="${user != null and user.id != null ? 'Save Changes' : 'Create User'}">Save</span>               </button>               <a th:href="@{/admin/view/users}"                  class="flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">                 <span class="material-symbols-outlined text-[18px]">close</span> Cancel               </a>               <div th:if="${user != null and user.id != null}" class="pt-2">                 <button type="submit" id="btn-delete-user" form="delete-user-form"                         class="flex w-full items-center justify-center gap-2 rounded-2xl border border-red-200 bg-red-50 px-5 py-3 text-sm font-bold text-red-700 hover:bg-red-100">                   <span class="material-symbols-outlined text-[18px]">delete_forever</span> Delete User                 </button>               </div>             </div>           </div>            <!-- Read-only meta (edit mode) -->           <div th:if="${user != null and user.id != null}"                class="rounded-3xl border border-slate-200 bg-slate-50 p-5">             <p class="text-xs font-black uppercase tracking-wide text-slate-500">Account Meta</p>             <dl class="mt-3 flex flex-col gap-2 text-xs">               <div class="flex justify-between">                 <dt class="text-slate-400">Registered</dt>                 <dd class="font-bold text-slate-700"                     th:text="${user.registrationDate != null ? #temporals.format(user.registrationDate,'dd MMM yyyy') : 'Ã¢â‚¬â€'}">Ã¢â‚¬â€</dd>               </div>               <div class="flex justify-between">                 <dt class="text-slate-400">Last login</dt>                 <dd class="font-bold text-slate-700"                     th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin,'dd MMM yyyy') : 'Never'}">Ã¢â‚¬â€</dd>               </div>             </dl>           </div>         </div>        </form>        <form th:if="${user != null and user.id != null}"             id="delete-user-form"             th:action="@{/admin/users/{id}/delete(id=${user.id})}"             method="post"             onsubmit="return confirm('Delete this user permanently?')">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>       </form>      </main>   </div> </div> </body> </html>
