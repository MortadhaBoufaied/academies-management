<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${trainer != null and trainer.id != null ? 'Edit Trainer' : 'New Trainer'} + ' Ã¢â‚¬â€ Football Academy'">Trainer Form</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">    <div th:replace="pages/modules/components/sidebar :: sidebar('trainers')"></div>    <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar(${trainer != null and trainer.id != null ? 'Edit Trainer' : 'New Trainer'})"></div>      <main class="px-4 py-6 sm:px-6 lg:px-8">        <!-- Breadcrumb -->       <nav class="mb-4 flex items-center gap-2 text-sm text-slate-500">         <a th:href="@{/admin/view/dashboard}" class="hover:text-emerald-600">Dashboard</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <a th:href="@{/admin/view/trainers}" class="hover:text-emerald-600">Trainers</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <span class="font-semibold text-slate-700"               th:text="${trainer != null and trainer.id != null ? 'Edit' : 'New'}">New</span>       </nav>        <!-- Header -->       <section class="rounded-3xl bg-gradient-to-r from-teal-700 via-teal-600 to-emerald-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-teal-200">Trainers</p>         <h2 class="mt-2 text-3xl font-black"             th:text="${trainer != null and trainer.id != null ? 'Edit Trainer' : 'Register New Trainer'}">Trainer</h2>       </section>        <!-- Error -->       <div th:if="${error}" class="mt-4 flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">         <span class="material-symbols-outlined text-[18px]">error</span>         <span th:text="${error}">Error.</span>       </div>        <!-- Form -->       <form th:action="${trainer != null and trainer.id != null} ? @{/admin/trainers/{id}(id=${trainer.id})} : @{/admin/trainers}"             method="post"             id="trainer-form"             class="mt-6 grid gap-6 xl:grid-cols-3">          <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>          <!-- Left: Main fields -->         <div class="col-span-2 flex flex-col gap-6">            <!-- Identity -->           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="flex items-center gap-2 text-base font-black text-slate-900">               <span class="material-symbols-outlined text-teal-600">person</span> Identity             </h3>             <div class="mt-5 grid gap-5 sm:grid-cols-2">               <div class="sm:col-span-2">                 <label for="nom" class="mb-1.5 block text-sm font-semibold text-slate-700">Full Name <span class="text-red-500">*</span></label>                 <input type="text" id="nom" name="nom" required                        th:value="${trainer?.user?.nom}"                        placeholder="e.g. Ahmed Belkacem"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>               <div>                 <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700">Email</label>                 <input type="email" id="email" name="email"                        th:value="${trainer?.user?.email}"                        placeholder="trainer@academy.com"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>               <div>                 <label for="phone" class="mb-1.5 block text-sm font-semibold text-slate-700">Phone</label>                 <input type="tel" id="phone" name="phone"                        th:value="${trainer?.user?.tel}"                        placeholder="+213 6xx xxx xxx"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>             </div>           </div>            <!-- Professional Info -->           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="flex items-center gap-2 text-base font-black text-slate-900">               <span class="material-symbols-outlined text-teal-600">sports</span> Professional Info             </h3>             <div class="mt-5 grid gap-5 sm:grid-cols-2">               <div>                 <label for="speciality" class="mb-1.5 block text-sm font-semibold text-slate-700">Speciality <span class="text-red-500">*</span></label>                 <input type="text" id="speciality" name="speciality" required                        th:value="${trainer?.speciality}"                        placeholder="e.g. Goalkeeping, Fitness"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>               <div>                 <label for="experience" class="mb-1.5 block text-sm font-semibold text-slate-700">Years of Experience</label>                 <input type="text" id="experience" name="experience"                        th:value="${trainer?.experience}"                        placeholder="5"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>               <div>                 <label for="license" class="mb-1.5 block text-sm font-semibold text-slate-700">License / Certification</label>                 <input type="text" id="license" name="license"                        th:value="${trainer?.license}"                        placeholder="e.g. UEFA B"                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">               </div>               <div>                 <label for="divisionId" class="mb-1.5 block text-sm font-semibold text-slate-700">Division</label>                 <select id="divisionId" name="divisionId"                         class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20">                   <option value="">No division</option>                   <option th:each="div : ${divisions}"                           th:value="${div.id}"                           th:text="${div.nom}"                           th:selected="${trainer?.division?.id == div.id}">Division</option>                 </select>               </div>               <div class="sm:col-span-2">                 <label for="notes" class="mb-1.5 block text-sm font-semibold text-slate-700">Notes</label>                 <textarea id="notes" name="notes" rows="4"                           th:text="${trainer?.notes}"                           placeholder="Additional notes about the trainer..."                           class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-teal-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-400/20 resize-none"></textarea>               </div>             </div>           </div>          </div>          <!-- Right: Actions -->         <div class="flex flex-col gap-6">           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="text-base font-black text-slate-900">Actions</h3>             <div class="mt-4 flex flex-col gap-3">               <button type="submit" id="btn-save-trainer"                       class="flex w-full items-center justify-center gap-2 rounded-2xl bg-teal-600 px-5 py-3 text-sm font-bold text-white shadow transition hover:bg-teal-700">                 <span class="material-symbols-outlined text-[18px]">save</span>                 <span th:text="${trainer != null and trainer.id != null ? 'Save Changes' : 'Register Trainer'}">Save</span>               </button>               <a th:href="@{/admin/view/trainers}"                  class="flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">                 <span class="material-symbols-outlined text-[18px]">close</span> Cancel               </a>               <!-- Delete in edit mode -->               <div th:if="${trainer != null and trainer.id != null}" class="pt-2">                 <button type="submit" id="btn-delete-trainer" form="delete-trainer-form"                         class="flex w-full items-center justify-center gap-2 rounded-2xl border border-red-200 bg-red-50 px-5 py-3 text-sm font-bold text-red-700 transition hover:bg-red-100">                   <span class="material-symbols-outlined text-[18px]">delete_forever</span> Delete Trainer                 </button>               </div>             </div>           </div>            <!-- Help card -->           <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5">             <p class="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wide text-slate-500">               <span class="material-symbols-outlined text-[14px]">info</span> Help             </p>             <p class="mt-2 text-xs text-slate-500 leading-relaxed">               Trainers are linked to a division and their assigned players can be managed from the Players module.             </p>           </div>         </div>        </form>        <form th:if="${trainer != null and trainer.id != null}"             id="delete-trainer-form"             th:action="@{/admin/trainers/{id}/delete(id=${trainer.id})}"             method="post"             onsubmit="return confirm('Delete this trainer permanently?')">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>       </form>      </main>   </div> </div> </body> </html>
