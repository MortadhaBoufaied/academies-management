<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Team Chat Ã¢â‚¬â€ Football Academy</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <style>     body { font-family: 'Public Sans', sans-serif; }     .chat-area { height: calc(100vh - 22rem); min-height: 320px; }     .bubble-out { border-radius: 18px 18px 4px 18px; }     .bubble-in  { border-radius: 18px 18px 18px 4px; }     @keyframes fadeUp { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }     .fade-up { animation: fadeUp 0.25s ease both; }   </style>   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">    <div th:replace="pages/modules/components/sidebar :: sidebar('chat')"></div>    <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Team Chat')"></div>      <main class="px-4 py-6 sm:px-6 lg:px-8">        <!-- Header -->       <section class="rounded-3xl bg-gradient-to-r from-rose-700 via-pink-600 to-fuchsia-600 p-6 text-white shadow-xl">         <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">           <div>             <p class="text-xs font-bold uppercase tracking-[0.4em] text-pink-200">Communication</p>             <h2 class="mt-1 text-3xl font-black">Team Chat</h2>           </div>           <div class="flex gap-2">             <a th:href="@{/admin/view/chatbot}"                class="inline-flex items-center gap-2 rounded-xl bg-white/20 px-4 py-2.5 text-sm font-bold text-white ring-1 ring-white/30 hover:bg-white/30">               <span class="material-symbols-outlined text-[16px]">smart_toy</span> Chatbot             </a>           </div>         </div>       </section>        <!-- Chat UI -->       <div class="mt-5 grid gap-5 xl:grid-cols-4">          <!-- Sidebar: members online -->         <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">           <h3 class="flex items-center gap-2 text-sm font-black text-slate-900">             <span class="h-2 w-2 rounded-full bg-emerald-500"></span> Members           </h3>           <ul th:if="${chatUsers != null and not #lists.isEmpty(chatUsers)}"               class="mt-4 flex flex-col gap-2">             <li th:each="u : ${chatUsers}"                 class="flex items-center gap-3 rounded-2xl px-3 py-2 hover:bg-slate-50 cursor-pointer">               <div class="relative flex h-9 w-9 shrink-0 items-center justify-center overflow-hidden rounded-full bg-rose-100 text-sm font-black text-rose-700">                 <img th:if="${u.profilePhotoUrl}" th:src="${u.profilePhotoUrl}" class="h-full w-full object-cover" alt="">                 <span th:unless="${u.profilePhotoUrl}"                       th:text="${#strings.substring(u.nom,0,1).toUpperCase()}">U</span>                 <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full border-2 border-white bg-emerald-400"></span>               </div>               <div class="min-w-0">                 <p class="truncate text-sm font-bold text-slate-900" th:text="${u.nom}">Name</p>                 <p class="text-xs text-slate-500"                    th:text="${u.mainRole != null ? u.mainRole.name() : 'USER'}">Role</p>               </div>             </li>           </ul>           <div th:if="${chatUsers == null or #lists.isEmpty(chatUsers)}"                class="mt-4 text-center text-xs text-slate-400">No users online.</div>         </div>          <!-- Main chat window (3/4) -->         <div class="col-span-3 flex flex-col rounded-3xl border border-slate-200 bg-white shadow-sm">            <!-- Chat header bar -->           <div class="flex items-center gap-3 border-b border-slate-100 px-6 py-4">             <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-100 text-rose-600">               <span class="material-symbols-outlined text-[20px]">forum</span>             </div>             <div>               <p class="font-black text-slate-900">Academy General</p>               <p class="text-xs text-slate-500">Internal team communication</p>             </div>           </div>            <!-- Messages area -->           <div id="chat-messages" class="chat-area flex flex-col gap-3 overflow-y-auto px-6 py-5">              <!-- Empty state -->             <div th:if="${messages == null or #lists.isEmpty(messages)}"                  class="flex h-full flex-col items-center justify-center text-center">               <span class="material-symbols-outlined text-[48px] text-slate-300">forum</span>               <p class="mt-3 font-bold text-slate-500">No messages yet</p>               <p class="text-sm text-slate-400">Be the first to say something!</p>             </div>              <!-- Message bubbles -->             <div th:each="msg : ${messages}"                  th:classappend="${msg.senderId == session.adminId} ? ' flex flex-row-reverse' : ' flex'"                  class="fade-up items-end gap-3">                <!-- Avatar -->               <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-black"                    th:classappend="${msg.senderId == session.adminId} ? ' bg-rose-100 text-rose-700' : ' bg-slate-100 text-slate-600'"                    th:text="${msg.senderName != null ? #strings.substring(msg.senderName,0,1).toUpperCase() : '?'}">U</div>                <!-- Bubble -->               <div class="max-w-sm">                 <p class="mb-1 text-xs font-semibold text-slate-400"                    th:classappend="${msg.senderId == session.adminId} ? ' text-right' : ''"                    th:text="${msg.senderName ?: 'Unknown'}">Sender</p>                 <div class="px-4 py-3 text-sm"                      th:classappend="${msg.senderId == session.adminId} ? ' bg-rose-600 text-white bubble-out' : ' bg-slate-100 text-slate-800 bubble-in'"                      th:text="${msg.content}">Message text</div>                 <p class="mt-1 text-[10px] text-slate-400"                    th:classappend="${msg.senderId == session.adminId} ? ' text-right' : ''"                    th:text="${msg.sentAt != null ? #temporals.format(msg.sentAt,'HH:mm') : ''}">Time</p>               </div>              </div>           </div>            <!-- Input bar -->           <div class="border-t border-slate-100 p-4">             <form th:action="@{/admin/chat/send}" method="post"                   id="chat-form"                   class="flex items-center gap-3">               <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                      th:value="${_csrf != null ? _csrf.token : ''}"/>               <input type="text" name="content" id="chat-input"                      placeholder="Type a messageÃ¢â‚¬Â¦" required autocomplete="off"                      class="min-w-0 flex-1 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-rose-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-rose-400/20">               <button type="submit"                       class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-rose-600 text-white shadow transition hover:bg-rose-700 active:scale-95">                 <span class="material-symbols-outlined text-[20px]">send</span>               </button>             </form>           </div>          </div>       </div>      </main>   </div> </div> <script>   // Auto-scroll to bottom on load   const chatArea = document.getElementById('chat-messages');   if (chatArea) chatArea.scrollTop = chatArea.scrollHeight; </script> </body> </html>
