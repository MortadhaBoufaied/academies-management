<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Notification Form - Football Academy</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('notifications')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Notification Form')"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <section class="rounded-3xl bg-gradient-to-r from-purple-700 via-purple-600 to-indigo-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-purple-200">Notifications</p>         <h2 class="mt-2 text-3xl font-black">Create Notification</h2>       </section>       <form th:action="@{/admin/notifications}" method="post" class="mt-6 grid gap-6 xl:grid-cols-3">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">         <section class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <div class="grid gap-5 sm:grid-cols-2">             <div class="sm:col-span-2">               <label for="title" class="mb-1.5 block text-sm font-semibold text-slate-700">Title</label>               <input id="title" name="title" required th:value="${notification?.title}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="category" class="mb-1.5 block text-sm font-semibold text-slate-700">Category</label>               <select id="category" name="category" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="GENERAL">General</option>                 <option value="PARENTS">Parents</option>                 <option value="FOOTBALLERS">Footballers</option>                 <option value="TRAINERS">Trainers</option>                 <option value="ADMIN">Admin</option>               </select>             </div>             <div>               <label for="userId" class="mb-1.5 block text-sm font-semibold text-slate-700">Target User ID</label>               <input id="userId" name="userId" type="number" th:value="${notification?.userId}" placeholder="Blank for broadcast" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div class="sm:col-span-2">               <label for="content" class="mb-1.5 block text-sm font-semibold text-slate-700">Content</label>               <textarea id="content" name="content" required rows="6" th:text="${notification?.content}" class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>           </div>         </section>         <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <button type="submit" class="w-full rounded-2xl bg-purple-600 px-5 py-3 text-sm font-bold text-white hover:bg-purple-700">Send Notification</button>           <a th:href="@{/admin/view/notifications}" class="mt-3 block rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>         </aside>       </form>     </main>   </div> </div> </body> </html>
