<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Center</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 font-['Public_Sans'] antialiased">   <div class="min-h-screen">     <div th:replace="pages/modules/components/sidebar :: sidebar('notifications')"></div>     <div class="min-h-screen lg:pl-72">       <div th:replace="pages/modules/components/navbar :: navbar('Center')"></div>       <main class="px-4 py-6 sm:px-6 lg:px-8"><section class="rounded-3xl bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 p-8 text-white shadow-xl"><p class="text-xs font-semibold uppercase tracking-[0.35em] text-emerald-100">Stay Informed</p><h2 class="mt-3 text-3xl font-black">Your Notifications</h2><p class="mt-3 text-sm text-emerald-50">Important updates and announcements for your account.</p></section><section class="mt-6 max-w-3xl mx-auto"><div class="rounded-3xl border border-slate-200 bg-white shadow-sm"><div id="notificationsList" class="divide-y divide-slate-100"></div><div id="emptyState" class="px-8 py-12 text-center"><svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 0 0-4-5.659V5a
