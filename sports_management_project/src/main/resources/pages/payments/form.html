<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${payment != null and payment.id != null ? 'Edit Payment' : 'New Payment'} + ' - Football Academy'">Payment Form</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('payments')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar(${payment != null and payment.id != null ? 'Edit Payment' : 'New Payment'})"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <nav class="mb-4 flex items-center gap-2 text-sm text-slate-500">         <a th:href="@{/admin/view/dashboard}" class="hover:text-emerald-600">Dashboard</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <a th:href="@{/admin/view/payments}" class="hover:text-emerald-600">Payments</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <span class="font-semibold text-slate-700" th:text="${payment != null and payment.id != null ? 'Edit' : 'New'}">New</span>       </nav>        <section class="rounded-3xl bg-gradient-to-r from-amber-600 via-yellow-500 to-emerald-500 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-amber-100">Payments</p>         <h2 class="mt-2 text-3xl font-black" th:text="${payment != null and payment.id != null ? 'Edit Payment' : 'Create Payment'}">Payment</h2>       </section>        <form th:action="${payment != null and payment.id != null} ? @{/admin/payments/{id}(id=${payment.id})} : @{/admin/payments}"             method="post" id="payment-form" class="mt-6 grid gap-6 xl:grid-cols-3">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">         <input th:if="${payment != null and payment.version != null}" type="hidden" name="version" th:value="${payment.version}">          <section class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <h3 class="flex items-center gap-2 text-base font-black text-slate-900">             <span class="material-symbols-outlined text-amber-600">payments</span> Payment Details           </h3>           <div class="mt-5 grid gap-5 sm:grid-cols-2">             <div>               <label for="montant" class="mb-1.5 block text-sm font-semibold text-slate-700">Amount</label>               <input id="montant" name="montant" type="number" min="0" step="0.01" th:value="${payment?.montant}"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="currency" class="mb-1.5 block text-sm font-semibold text-slate-700">Currency</label>               <input id="currency" name="currency" maxlength="3" th:value="${payment?.currency ?: 'USD'}"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm uppercase">             </div>             <div>               <label for="mois" class="mb-1.5 block text-sm font-semibold text-slate-700">Billing Month</label>               <input id="mois" name="mois" type="date" th:value="${payment?.mois != null ? #temporals.format(payment.mois,'yyyy-MM-dd') : ''}"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="dueDate" class="mb-1.5 block text-sm font-semibold text-slate-700">Due Date</label>               <input id="dueDate" name="dueDate" type="date" th:value="${payment?.dueDate != null ? #temporals.format(payment.dueDate,'yyyy-MM-dd') : ''}"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="playerId" class="mb-1.5 block text-sm font-semibold text-slate-700">Player</label>               <select id="playerId" name="playerId" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="">No player</option>                 <option th:each="player : ${players}" th:value="${player.id}" th:text="${player.user != null ? player.user.nom : 'Player ' + player.id}" th:selected="${payment?.player?.id == player.id}">Player</option>               </select>             </div>             <div>               <label for="parentId" class="mb-1.5 block text-sm font-semibold text-slate-700">Parent</label>               <select id="parentId" name="parentId" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="">No parent</option>                 <option th:each="parent : ${parents}" th:value="${parent.id}" th:text="${parent.user != null ? parent.user.nom : 'Parent ' + parent.id}" th:selected="${payment?.parent?.id == parent.id}">Parent</option>               </select>             </div>             <div>               <label for="paymentType" class="mb-1.5 block text-sm font-semibold text-slate-700">Type</label>               <select id="paymentType" name="paymentType" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="MONTHLY_FEE" th:selected="${payment?.paymentType == null or payment.paymentType == 'MONTHLY_FEE'}">Monthly fee</option>                 <option value="REGISTRATION" th:selected="${payment?.paymentType == 'REGISTRATION'}">Registration</option>                 <option value="EQUIPMENT" th:selected="${payment?.paymentType == 'EQUIPMENT'}">Equipment</option>                 <option value="OTHER" th:selected="${payment?.paymentType == 'OTHER'}">Other</option>               </select>             </div>             <div>               <label for="status" class="mb-1.5 block text-sm font-semibold text-slate-700">Status</label>               <select id="status" name="status" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">                 <option value="PENDING" th:selected="${payment?.status == null or payment.status == 'PENDING'}">Pending</option>                 <option value="PAID" th:selected="${payment?.status == 'PAID'}">Paid</option>                 <option value="FAILED" th:selected="${payment?.status == 'FAILED'}">Failed</option>                 <option value="CANCELLED" th:selected="${payment?.status == 'CANCELLED'}">Cancelled</option>               </select>             </div>             <div class="sm:col-span-2">               <label for="description" class="mb-1.5 block text-sm font-semibold text-slate-700">Description</label>               <textarea id="description" name="description" rows="4" th:text="${payment?.description}"                         class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>           </div>         </section>          <aside class="flex flex-col gap-6">           <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <label class="flex items-center gap-3 text-sm font-semibold text-slate-700">               <input type="checkbox" name="paid" value="true" th:checked="${payment?.paid}" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">               Mark as paid             </label>             <div class="mt-4 flex flex-col gap-3">               <button type="submit" class="rounded-2xl bg-amber-600 px-5 py-3 text-sm font-bold text-white hover:bg-amber-700">Save Payment</button>               <a th:href="@{/admin/view/payments}" class="rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>               <button th:if="${payment != null and payment.id != null}" type="submit" form="delete-payment-form" class="rounded-2xl border border-red-200 bg-red-50 px-5 py-3 text-sm font-bold text-red-700 hover:bg-red-100">Delete Payment</button>             </div>           </section>         </aside>       </form>        <form th:if="${payment != null and payment.id != null}" id="delete-payment-form" th:action="@{/admin/payments/{id}/delete(id=${payment.id})}" method="post" onsubmit="return confirm('Delete this payment?')">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">       </form>     </main>   </div> </div> </body> </html>
