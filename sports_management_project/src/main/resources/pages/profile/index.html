<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Profile</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">   <div th:replace="pages/modules/components/sidebar :: sidebar('profile')"></div>   <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Profile')"></div>     <main class="px-4 py-6 sm:px-6 lg:px-8">       <div th:if="${param.updated}" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800">Profile updated.</div>       <section class="rounded-3xl bg-gradient-to-r from-slate-800 via-slate-700 to-slate-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-slate-300">Account</p>         <h2 class="mt-2 text-3xl font-black">Profile</h2>       </section>       <form th:action="@{/admin/profile}" method="post" class="mt-6 grid gap-6 xl:grid-cols-3">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}">         <section class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <div class="grid gap-5 sm:grid-cols-2">             <div class="sm:col-span-2">               <label for="nom" class="mb-1.5 block text-sm font-semibold text-slate-700">Full Name</label>               <input id="nom" name="nom" th:value="${user?.nom ?: session.adminUser}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700">Email</label>               <input id="email" name="email" type="email" th:value="${user?.email}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div>               <label for="tel" class="mb-1.5 block text-sm font-semibold text-slate-700">Phone</label>               <input id="tel" name="tel" th:value="${user?.tel}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">             </div>             <div class="sm:col-span-2">               <label for="bio" class="mb-1.5 block text-sm font-semibold text-slate-700">Bio</label>               <textarea id="bio" name="bio" rows="4" th:text="${user?.bio}" class="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"></textarea>             </div>           </div>         </section>         <aside class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <button type="submit" class="w-full rounded-2xl bg-slate-800 px-5 py-3 text-sm font-bold text-white hover:bg-slate-900">Update Profile</button>           <a th:href="@{/admin/view/dashboard}" class="mt-3 block rounded-2xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Dashboard</a>         </aside>       </form>     </main>   </div> </div> </body> </html>
