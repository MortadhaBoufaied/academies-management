<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${division != null and division.id != null ? 'Edit Division' : 'New Division'} + ' Ã¢â‚¬â€ Football Academy'">Division Form</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">    <div th:replace="pages/modules/components/sidebar :: sidebar('divisions')"></div>    <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar(${division != null and division.id != null ? 'Edit Division' : 'New Division'})"></div>      <main class="px-4 py-6 sm:px-6 lg:px-8">        <nav class="mb-4 flex items-center gap-2 text-sm text-slate-500">         <a th:href="@{/admin/view/dashboard}" class="hover:text-emerald-600">Dashboard</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <a th:href="@{/admin/view/divisions}" class="hover:text-emerald-600">Divisions</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <span class="font-semibold text-slate-700"               th:text="${division != null and division.id != null ? 'Edit' : 'New'}">New</span>       </nav>        <section class="rounded-3xl bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-orange-200">Divisions</p>         <h2 class="mt-2 text-3xl font-black"             th:text="${division != null and division.id != null ? 'Edit Division' : 'Create New Division'}">Division</h2>       </section>        <div th:if="${error}" class="mt-4 flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">         <span class="material-symbols-outlined text-[18px]">error</span>         <span th:text="${error}">Error.</span>       </div>        <form th:action="${division != null and division.id != null} ? @{/admin/divisions/{id}(id=${division.id})} : @{/admin/divisions}"             method="post"             id="division-form"             class="mt-6 grid gap-6 xl:grid-cols-3">          <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>          <!-- Main fields -->         <div class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <h3 class="flex items-center gap-2 text-base font-black text-slate-900">             <span class="material-symbols-outlined text-orange-600">account_tree</span> Division Details           </h3>           <div class="mt-5 grid gap-5 sm:grid-cols-2">              <div class="sm:col-span-2">               <label for="nom" class="mb-1.5 block text-sm font-semibold text-slate-700">Division Name <span class="text-red-500">*</span></label>               <input type="text" id="nom" name="nom" required                      th:value="${division?.nom}"                      placeholder="e.g. Under-17 Elite"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-orange-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-400/20">             </div>              <div>               <label for="categorie" class="mb-1.5 block text-sm font-semibold text-slate-700">Category <span class="text-red-500">*</span></label>               <select id="categorie" name="categorie" required                       class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-orange-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-400/20">                 <option value="">Select category...</option>                 <option value="U10"   th:selected="${division?.categorie == 'U10'}">U10 (Under 10)</option>                 <option value="U13"   th:selected="${division?.categorie == 'U13'}">U13 (Under 13)</option>                 <option value="U15"   th:selected="${division?.categorie == 'U15'}">U15 (Under 15)</option>                 <option value="U17"   th:selected="${division?.categorie == 'U17'}">U17 (Under 17)</option>                 <option value="U19"   th:selected="${division?.categorie == 'U19'}">U19 (Under 19)</option>                 <option value="SENIOR" th:selected="${division?.categorie == 'SENIOR'}">Senior</option>                 <option value="ELITE" th:selected="${division?.categorie == 'ELITE'}">Elite</option>               </select>             </div>              <div>               <label for="sportId" class="mb-1.5 block text-sm font-semibold text-slate-700">Sport</label>               <select id="sportId" name="sportId"                       class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-orange-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-400/20">                 <option value="">No sport assigned</option>                 <option th:each="sport : ${sports}"                         th:value="${sport.id}"                         th:text="${sport.name != null ? sport.name : sport.code}"                         th:selected="${division?.sport?.id == sport.id}">Sport</option>               </select>             </div>            </div>         </div>          <!-- Sidebar: actions + info -->         <div class="flex flex-col gap-6">            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="text-base font-black text-slate-900">Actions</h3>             <div class="mt-4 flex flex-col gap-3">               <button type="submit" id="btn-save-division"                       class="flex w-full items-center justify-center gap-2 rounded-2xl bg-orange-600 px-5 py-3 text-sm font-bold text-white shadow hover:bg-orange-700">                 <span class="material-symbols-outlined text-[18px]">save</span>                 <span th:text="${division != null and division.id != null ? 'Save Changes' : 'Create Division'}">Save</span>               </button>               <a th:href="@{/admin/view/divisions}"                  class="flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">                 <span class="material-symbols-outlined text-[18px]">close</span> Cancel               </a>               <div th:if="${division != null and division.id != null}" class="pt-2">                 <button type="submit" id="btn-delete-division" form="delete-division-form"                         class="flex w-full items-center justify-center gap-2 rounded-2xl border border-red-200 bg-red-50 px-5 py-3 text-sm font-bold text-red-700 hover:bg-red-100">                   <span class="material-symbols-outlined text-[18px]">delete_forever</span> Delete Division                 </button>               </div>             </div>           </div>            <!-- Stats (edit mode) -->           <div th:if="${division != null and division.id != null}"                class="rounded-3xl border border-slate-200 bg-slate-50 p-5">             <p class="text-xs font-black uppercase tracking-wide text-slate-500">Current Members</p>             <div class="mt-3 grid grid-cols-2 gap-3">               <div class="rounded-2xl bg-white p-3 text-center shadow-sm">                 <p class="text-2xl font-black text-orange-600"                    th:text="${division.players != null ? division.players.size() : 0}">0</p>                 <p class="text-xs text-slate-500">Players</p>               </div>               <div class="rounded-2xl bg-white p-3 text-center shadow-sm">                 <p class="text-2xl font-black text-teal-600"                    th:text="${division.trainers != null ? division.trainers.size() : 0}">0</p>                 <p class="text-xs text-slate-500">Trainers</p>               </div>             </div>           </div>          </div>        </form>        <form th:if="${division != null and division.id != null}"             id="delete-division-form"             th:action="@{/admin/divisions/{id}/delete(id=${division.id})}"             method="post"             onsubmit="return confirm('Delete this division and unlink all members?')">         <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>       </form>      </main>   </div> </div> </body> </html>
