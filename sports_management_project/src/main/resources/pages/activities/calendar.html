<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Activities Calendar Ã¢â‚¬â€ Football Academy</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">   <!-- FullCalendar CDN -->   <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">   <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>   <style>     body { font-family: 'Public Sans', sans-serif; }     #calendar { --fc-border-color: #e2e8f0; --fc-button-bg-color: #0284c7; --fc-button-hover-bg-color: #0369a1; --fc-today-bg-color: #f0fdf4; }     .fc .fc-toolbar-title { font-size: 1.1rem; font-weight: 900; }     .fc .fc-button { font-family: 'Public Sans', sans-serif; font-weight: 700; border-radius: 12px; font-size: 0.8rem; }     .fc-event { border-radius: 8px !important; font-size: 0.75rem; font-weight: 600; }   </style>   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">    <div th:replace="pages/modules/components/sidebar :: sidebar('activities')"></div>    <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar('Activities Calendar')"></div>      <main class="px-4 py-6 sm:px-6 lg:px-8">        <!-- Breadcrumb -->       <nav class="mb-4 flex items-center gap-2 text-sm text-slate-500">         <a th:href="@{/admin/view/dashboard}" class="hover:text-emerald-600">Dashboard</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <a th:href="@{/admin/view/activities}" class="hover:text-emerald-600">Activities</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <span class="font-semibold text-slate-700">Calendar</span>       </nav>        <!-- Header -->       <section class="rounded-3xl bg-gradient-to-r from-sky-700 via-sky-600 to-cyan-600 p-8 text-white shadow-xl">         <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">           <div>             <p class="text-xs font-bold uppercase tracking-[0.4em] text-sky-200">Operations</p>             <h2 class="mt-2 text-3xl font-black">Activities Calendar</h2>             <p class="mt-1 text-sm text-sky-100">               <span th:text="${activities != null ? activities.size() : 0}">0</span> event(s) this period.             </p>           </div>           <div class="flex gap-3">             <a th:href="@{/admin/view/activities}"                class="inline-flex items-center gap-2 rounded-xl bg-white/20 px-4 py-2.5 text-sm font-bold text-white ring-1 ring-white/30 hover:bg-white/30">               <span class="material-symbols-outlined text-[16px]">list</span> List View             </a>             <a th:href="@{/admin/view/activities/new}"                class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-bold text-sky-700 shadow hover:bg-sky-50">               <span class="material-symbols-outlined text-[16px]">add_circle</span> New Activity             </a>           </div>         </div>       </section>        <!-- Two-column: calendar + upcoming sidebar -->       <div class="mt-6 grid gap-6 xl:grid-cols-4">          <!-- Calendar (3/4 width) -->         <div class="col-span-3 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <div id="calendar"></div>         </div>          <!-- Upcoming list (1/4 width) -->         <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <h3 class="text-base font-black text-slate-900">Upcoming</h3>            <div th:if="${activities == null or #lists.isEmpty(activities)}"                class="mt-4 flex flex-col items-center py-8 text-center">             <span class="material-symbols-outlined text-[36px] text-slate-300">event_busy</span>             <p class="mt-2 text-sm text-slate-500">No upcoming activities.</p>           </div>            <ul th:if="${activities != null and not #lists.isEmpty(activities)}"               class="mt-4 flex flex-col gap-3">             <li th:each="activity : ${activities}"                 class="rounded-2xl border border-slate-100 bg-slate-50 p-3 transition hover:border-sky-200 hover:bg-sky-50">               <p class="text-xs font-bold text-sky-600"                  th:text="${activity.date != null ? #temporals.format(activity.date,'EEE dd MMM') : 'No date'}">Date</p>               <p class="mt-0.5 font-bold text-slate-900 line-clamp-1" th:text="${activity.titre}">Title</p>               <div class="mt-1.5 flex items-center justify-between gap-2">                 <span class="flex items-center gap-1 text-xs text-slate-500">                   <span class="material-symbols-outlined text-[12px]">location_on</span>                   <span th:text="${activity.lieu ?: 'Ã¢â‚¬â€'}">Location</span>                 </span>                 <a th:href="@{/admin/view/activities/{id}/edit(id=${activity.id})}"                    class="rounded-lg px-2 py-1 text-[10px] font-bold text-sky-600 hover:bg-sky-100">Edit</a>               </div>             </li>           </ul>            <div class="mt-4 border-t border-slate-100 pt-4">             <a th:href="@{/admin/view/activities}"                class="flex items-center justify-center gap-1.5 text-sm font-semibold text-sky-600 hover:underline">               <span class="material-symbols-outlined text-[16px]">list</span> All Activities             </a>           </div>         </div>        </div>      </main>   </div> </div>  <!-- Inject Thymeleaf activities as JSON for FullCalendar --> <script th:inline="javascript">   /*<![CDATA[*/   const activities = /*[[${activities}]]*/ [];    document.addEventListener('DOMContentLoaded', function () {     const events = (activities || []).map(function (a) {       return {         id: a.id,         title: a.titre || 'Activity',         start: a.date,         location: a.lieu,         backgroundColor: '#0284c7',         borderColor: '#0369a1',         extendedProps: { lieu: a.lieu, description: a.description }       };     });      const calendarEl = document.getElementById('calendar');     const calendar = new FullCalendar.Calendar(calendarEl, {       initialView: 'dayGridMonth',       headerToolbar: {         left: 'prev,next today',         center: 'title',         right: 'dayGridMonth,timeGridWeek,listWeek'       },       events: events,       eventClick: function (info) {         const props = info.event.extendedProps;         alert(           info.event.title + '\n' +           'Ã°Å¸â€œÂ ' + (props.lieu || 'Ã¢â‚¬â€') + '\n' +           (props.description || '')         );       },       height: 'auto',       buttonText: { today: 'Today', month: 'Month', week: 'Week', list: 'List' }     });     calendar.render();   });   /*]]>*/ </script>  </body> </html>
