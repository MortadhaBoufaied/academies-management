<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title th:text="${activity != null and activity.id != null ? 'Edit Activity' : 'New Activity'} + ' Ã¢â‚¬â€ Football Academy'">Activity Form</title>   <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"> <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css"> </head> <body class="min-h-screen bg-slate-50 text-slate-900 antialiased"> <div class="min-h-screen">    <div th:replace="pages/modules/components/sidebar :: sidebar('activities')"></div>    <div class="min-h-screen lg:pl-72">     <div th:replace="pages/modules/components/navbar :: navbar(${activity != null and activity.id != null ? 'Edit Activity' : 'New Activity'})"></div>      <main class="px-4 py-6 sm:px-6 lg:px-8">        <nav class="mb-4 flex items-center gap-2 text-sm text-slate-500">         <a th:href="@{/admin/view/dashboard}" class="hover:text-emerald-600">Dashboard</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <a th:href="@{/admin/view/activities}" class="hover:text-emerald-600">Activities</a>         <span class="material-symbols-outlined text-[14px]">chevron_right</span>         <span class="font-semibold text-slate-700"               th:text="${activity != null and activity.id != null ? 'Edit' : 'New'}">New</span>       </nav>        <section class="rounded-3xl bg-gradient-to-r from-sky-700 via-sky-600 to-cyan-600 p-8 text-white shadow-xl">         <p class="text-xs font-bold uppercase tracking-[0.4em] text-sky-200">Activities</p>         <h2 class="mt-2 text-3xl font-black"             th:text="${activity != null and activity.id != null ? 'Edit Activity' : 'Schedule New Activity'}">Activity</h2>       </section>        <div th:if="${error}" class="mt-4 flex items-center gap-3 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-800">         <span class="material-symbols-outlined text-[18px]">error</span>         <span th:text="${error}">Error.</span>       </div>        <form th:action="${activity != null and activity.id != null} ? @{/admin/activities/{id}(id=${activity.id})} : @{/admin/activities}"             method="post"             id="activity-form"             class="mt-6 grid gap-6 xl:grid-cols-3">          <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"                th:value="${_csrf != null ? _csrf.token : ''}"/>          <!-- Main fields -->         <div class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">           <h3 class="flex items-center gap-2 text-base font-black text-slate-900">             <span class="material-symbols-outlined text-sky-600">event</span> Activity Details           </h3>           <div class="mt-5 grid gap-5 sm:grid-cols-2">              <div class="sm:col-span-2">               <label for="titre" class="mb-1.5 block text-sm font-semibold text-slate-700">Title <span class="text-red-500">*</span></label>               <input type="text" id="titre" name="titre" required                      th:value="${activity?.titre}"                      placeholder="e.g. Morning Training Session"                      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-sky-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-400/20">             </div>              <div>               <label for="date" class="mb-1.5 block text-sm font-semi                  th:text="${activity?.description}"                         placeholder="Describe the activity objectives, drills, or notes..."                         class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-sky-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-400/20 resize-none"></textarea>             </div>            </div>         </div>          <!-- Sidebar: actions -->         <div class="flex flex-col gap-6">           <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">             <h3 class="text-base font-black text-slate-900">Actions</h3>             <div class="mt-4 flex flex-col gap-3">               <button type="submit" id="btn-save-activity"                       class="flex w-full items-center justify-center gap-2 rounded-2xl bg-sky-600 px-5 py-3 text-sm font-bold text-white shadow hover:bg-sky-700">                 <span class="material-symbols-outlined text-[18px]">save</span>                 <span th:text="${activity != null and activity.id != null ? 'Save Changes' : 'Schedule Activity'}">Save</span>               </button>               <a th:href="@{/admin/view/activities}"                  class="flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">                 <span class="material-symbols-outlined text-[18px]">close</span> Cancel               </a>               <a th:href="@{/admin/view/activities/calendar}"                  class="flex w-full items-center justify-center gap-2 rounded-2xl border border-sky-200 bg-sky-50 px-5 py-3 text-sm font-semibold text-sky-700 hover:bg-sky-100">                 <span class="material-symbols-outlined text-[18px]">calendar_month</span> View Calendar               </a>               <div th:if="${activity != null and activity.id != null}" class="pt-2">                 <button type="submit" id="btn-delete-activity" form
