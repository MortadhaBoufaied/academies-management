<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Chat Hub</title>   <script src="https://cdn.tailwindcss.com?plugins=forms"></script>   <link rel="preconnect" href="https://fonts.googleapis.com">   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">   <link rel="stylesheet" th:href="@{/assets/css/admin-complete.css}" href="/assets/css/admin-complete.css">   <style>     .chat-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }     .chat-scrollbar::-webkit-scrollbar-thumb { background: rgba(100,116,139,.35); border-radius: 999px; }     .chat-scrollbar::-webkit-scrollbar-track { background: transparent; }   </style> </head> <body   class="min-h-screen bg-slate-100 text-slate-900 font-['Public_Sans'] antialiased"   th:attr="data-api-base=@{/api},data-profile-lite-path=@{/api/profile/me-lite},data-ws-path=@{/ws}">   <div class="min-h-screen">     <div th:replace="pages/modules/components/sidebar :: sidebar('chat')"></div>     <div class="min-h-screen lg:pl-72">       <div th:replace="pages/modules/components/navbar :: navbar('Chat Hub')"></div>        <main class="px-4 py-6 sm:px-6 lg:px-8">         <section class="rounded-3xl bg-gradient-to-r from-cyan-600 via-emerald-600 to-teal-600 p-6 text-white shadow-xl">           <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">             <div>               <p class="text-xs font-semibold uppercase tracking-[0.28em] text-cyan-100">Instant Messaging</p>               <h1 class="mt-2 text-3xl font-extrabold">Chat Hub</h1>               <p id="policyText" class="mt-2 text-sm text-emerald-50">Ready to connect</p>             </div>           </div>         </section>          <section class="mt-6 h-[calc(100vh-220px)] min-h-[560px] rounded-3xl border border-slate-200 bg-white shadow-lg">           <div class="grid h-full grid-cols-1 lg:grid-cols-12">             <aside id="directoryPanel" class="border-r border-slate-200 lg:col-span-4 xl:col-span-3">               <div class="border-b border-slate-200 p-4">                 <div class="mb-3 flex rounded-xl bg-slate-100 p-1 text-sm font-semibold">                   <button id="tabConversations" class="flex-1 rounded-lg px-3 py-2 text-slate-900">Conversations</button>                   <button id="tabContacts" class="flex-1 rounded-lg px-3 py-2 text-slate-500">Contacts</button>                 </div>                 <label for="directorySearch" class="sr-only">Search</label>                 <input id="directorySearch" type="text" placeholder="Search" class="w-full rounded-xl border-slate-200 bg-slate-50 text-sm focus:border-emerald-500 focus:ring-emerald-500" />               </div>               <div id="directoryList" class="chat-scrollbar h-[calc(100%-92px)] overflow-y-auto p-3"></div>             </aside>              <section id="threadPanel" class="hidden h-full lg:col-span-8 lg:flex lg:flex-col xl:col-span-9">               <header class="flex items-center gap-3 border-b border-slate-200 px-4 py-3">                 <button id="mobileBackBtn" type="button" class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 lg:hidden">Back</button>                 <div class="min-w-0 flex-1">                   <p id="threadTitle" class="truncate text-base font-bold text-slate-900">Select a conversation</p>                   <p id="threadSubtitle" class="truncate text-xs text-slate-500">Choose a contact or an existing conversation</p>                 </div>               </header>                <div id="messagesWrap" class="chat-scrollbar flex-1 overflow-y-auto bg-slate-50 px-4 py-5">                 <div id="messagesList" class="mx-auto flex w-full max-w-4xl flex-col gap-3"></div>               </div>                <form id="composerForm" class="border-t border-slate-200 bg-white p-3" autocomplete="off">                 <div class="mx-auto flex w-full max-w-4xl items-end gap-2">                   <textarea id="messageInput" rows="1" placeholder="Type your message" class="max-h-32 min-h-[44px] flex-1 resize-y rounded-2xl border-slate-200 bg-slate-50 text-sm focus:border-emerald-500 focus:ring-emerald-500"></textarea>                   <button id="sendBtn" type="submit" class="rounded-2xl bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">Send</button>                 </div>               </form>             </section>           </div>         </section>       </main>     </div>   </div>    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>   <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>   <script>     (() => {       const body = document.body;       const apiBase = body.dataset.apiBase || '/api';       const profileLitePath = body.dataset.profileLitePath || '/api/profile/me-lite';       const wsPath = body.dataset.wsPath || '/ws';        const ui = {         policyText: document.getElementById('policyText'),         tabConversations: document.getElementById('tabConversations'),         tabContacts: document.getElementById('tabContacts'),         directorySearch: document.getElementById('directorySearch'),         directoryList: document.getElementById('directoryList'),         threadPanel: document.getElementById('threadPanel'),         directoryPanel: document.getElementById('directoryPanel'),         threadTitle: document.getElementById('threadTitle'),         threadSubtitle: document.getElementById('threadSubtitle'),         messagesList: document.getElementById('messagesList'),         messagesWrap: document.getElementById('messagesWrap'),         composerForm: document.getElementById('composerForm'),         messageInput: document.getElementById('messageInput'),         sendBtn: document.getElementById('sendBtn'),         mobileBackBtn: document.getElementById('mobileBackBtn')       };        const state = {         me: null,         role: 'UNKNOWN',         isAdminFullAccess: false,         activeTab: 'conversations',         search: '',         contacts: [],         defaultContacts: [],         conversations: [],         activeConversationId: null,         messagesByConversation: new Map(),         stompClient: null,         conversationSub: null,         messageSubs: new Map(),         searchTimer: null       };        function headerMap(extra = {}) {         const token = localStorage.getItem('JWT_TOKEN') || localStorage.getItem('access_token') || localStorage.getItem('accessToken');         const headers = { Accept: 'application/json', ...extra };         if (token && !headers.Authorization) {           headers.Authorization = token.startsWith('Bearer ') ? token : `Bearer ${token}`;         }         return headers;       }        async function fetchJson(url, options = {}) {         const response = await fetch(url, {           credentials: 'same-origin',           ...options,           headers: headerMap(options.headers || {})         });          let payload = null;         const text = await response.text();         if (text) {           try { payload = JSON.parse(text); } catch (_) { payload = { message: text }; }         }          if (!response.ok) {           const msg = payload && (payload.error || payload.message)             ? (payload.error || payload.message)             : `Request failed (${response.status})`;           throw new Error(msg);         }         return payload;       }        async function api(path, options = {}) {         return fetchJson(`${apiBase}${path}`, options);       }        function setStatus(text, isError = false) {         if (isError) console.error('Chat status:', text);         else console.log('Chat status:', text);       }        function escapeHtml(value) {         return (value || '').replace(/[&<>'"]/g, (ch) => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[ch]));       }        function policyMessage() {         return 'Connect with your academy contacts instantly.';       }        function updateRolePanel() {         ui.policyText.textContent = policyMessage();       }        function isMobile() {         return window.matchMedia('(max-width: 1023px)').matches;       }        function updatePanels() {         if (!isMobile()) {           ui.directoryPanel.classList.remove('hidden');           ui.threadPanel.classList.remove('hidden');           return;         }          const hasActive = !!state.activeConversationId;         ui.directoryPanel.classList.toggle('hidden', hasActive);         ui.threadPanel.classList.toggle('hidden', !hasActive);       }        function conversationSortValue(conv) {         return new Date(conv.lastMessageAt || conv.updatedAt || 0).getTime();       }        function sortConversations() {         state.conversations.sort((a, b) => conversationSortValue(b) - conversationSortValue(a));       }        function displayConversationName(conv) {         const participants = Array.isArray(conv.participants) ? conv.participants : [];         if (participants.length === 2 && state.me) {           const other = participants.find((p) => Number(p.id) !== Number(state.me.id));           if (other && other.name) return other.name;         }         if (conv.title && conv.title.trim()) return conv.title;         if (participants.length > 0) return participants.map((p) => p.name || `User #${p.id}`).join(', ');         return `Conversation #${conv.id}`;       }        function formatRelativeTime(dateInput) {         if (!dateInput) return '';         const dt = new Date(dateInput);         if (Number.isNaN(dt.getTime())) return '';          const now = new Date();         const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());         const target = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());         const diffDays = Math.floor((today - target) / 86400000);          if (diffDays === 0) return `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;         if (diffDays === 1) return 'Yesterday';         if (diffDays < 7) return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()];         return `${dt.getDate()}/${dt.getMonth() + 1}`;       }        function getFilteredConversations() {         const q = state.search.trim().toLowerCase();         if (!q) return state.conversations;         return state.conversations.filter((conv) => {           const name = displayConversationName(conv).toLowerCase();           const last = (conv.lastMessage || '').toLowerCase();           return name.includes(q) || last.includes(q);         });       }        function renderDirectory() {         ui.tabConversations.className = state.activeTab === 'conversations'           ? 'flex-1 rounded-lg bg-white px-3 py-2 text-slate-900 shadow-sm'           : 'flex-1 rounded-lg px-3 py-2 text-slate-500';         ui.tabContacts.className = state.activeTab === 'contacts'           ? 'flex-1 rounded-lg bg-white px-3 py-2 text-slate-900 shadow-sm'           : 'flex-1 rounded-lg px-3 py-2 text-slate-500';          if (state.activeTab === 'conversations') {           const list = getFilteredConversations();           if (list.length === 0) {             ui.directoryList.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500">No conversations found.</div>';             return;           }            ui.directoryList.innerHTML = list.map((conv) => {             const active = Number(conv.id) === Number(state.activeConversationId);             const unread = Number(conv.unreadCount || 0);             const title = escapeHtml(displayConversationName(conv));             const last = escapeHtml(conv.lastMessage || 'No messages yet');             const time = formatRelativeTime(conv.lastMessageAt || conv.updatedAt);             return `               <button data-open-conv="${conv.id}" class="mb-2 flex w-full items-start gap-3 rounded-2xl border p-3 text-left transition ${active ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white hover:bg-slate-50'}">                 <div class="mt-0.5 h-10 w-10 shrink-0 rounded-xl bg-slate-200 text-center text-sm font-bold leading-10 text-slate-700">${title.charAt(0) || '?'}</div>                 <div class="min-w-0 flex-1">                   <div class="flex items-center justify-between gap-2">                     <p class="truncate text-sm font-semibold text-slate-900">${title}</p>                     <span class="text-xs text-slate-400">${time}</span>                   </div>                   <p class="mt-1 line-clamp-2 text-xs text-slate-500">${last}</p>                 </div>                 ${unread > 0 ? `<span class="rounded-full bg-emerald-600 px-2 py-0.5 text-[11px] font-bold text-white">${unread > 99 ? '99+' : unread}</span>` : ''}               </button>`;           }).join('');           return;         }          if (state.contacts.length === 0) {           ui.directoryList.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500">No contacts available for your role.</div>';           return;         }          ui.directoryList.innerHTML = state.contacts.map((contact) => {           const isGroup = (contact.kind || '').toUpperCase() === 'GROUP';           const role = isGroup ? 'GROUP' : (contact.role || 'USER');           const label = isGroup ? 'Group chat' : roleLabel(role);           return `             <button data-open-contact="${contact.id}" data-kind="${contact.kind || 'USER'}" class="mb-2 flex w-full items-start gap-3 rounded-2xl border border-slate-200 bg-white p-3 text-left transition hover:bg-slate-50">               <div class="mt-0.5 h-10 w-10 shrink-0 rounded-xl ${isGroup ? 'bg-cyan-100 text-cyan-700' : 'bg-emerald-100 text-emerald-700'} text-center text-sm font-bold leading-10">${isGroup ? '#' : (escapeHtml(contact.name || '?').charAt(0) || '?')}</div>               <div class="min-w-0 flex-1">                 <p class="truncate text-sm font-semibold text-slate-900">${escapeHtml(contact.name || 'Unknown')}</p>                 <p class="truncate text-xs text-slate-500">${label}${contact.email ? ` - ${escapeHtml(contact.email)}` : ''}</p>               </div>             </button>`;         }).join('');       }        function renderMessages() {         if (!state.activeConversationId) {           ui.threadTitle.textContent = 'Select a conversation';           ui.threadSubtitle.textContent = 'Choose a contact or an existing conversation';           ui.messagesList.innerHTML = '<div class="mx-auto mt-10 max-w-md rounded-2xl border border-dashed border-slate-300 bg-white p-6 text-center text-sm text-slate-500">Your messages will appear here.</div>';           ui.sendBtn.disabled = true;           return;         }          const conversation = state.conversations.find((c) => Number(c.id) === Number(state.activeConversationId));         ui.threadTitle.textContent = conversation ? displayConversationName(conversation) : `Conversation #${state.activeConversationId}`;          if (conversation && Array.isArray(conversation.participants)) {           ui.threadSubtitle.textContent = `${conversation.participants.length} participant${conversation.participants.length > 1 ? 's' : ''}`;         } else {           ui.threadSubtitle.textContent = 'Direct or group conversation';         }          const msgs = state.messagesByConversation.get(state.activeConversationId) || [];         if (msgs.length === 0) {           ui.messagesList.innerHTML = '<div class="mx-auto mt-10 max-w-md rounded-2xl border border-dashed border-slate-300 bg-white p-6 text-center text-sm text-slate-500">No messages yet. Start the conversation.</div>';           ui.sendBtn.disabled = false;           return;         }          ui.messagesList.innerHTML = msgs.map((m, idx) => {           const mine = Number(m.senderId) === Number(state.me.id);           const prev = msgs[idx - 1];           const showTime = !prev || Number(prev.senderId) !== Number(m.senderId) || Math.abs(new Date(m.timestamp).getTime() - new Date(prev.timestamp).getTime()) > 5 * 60 * 1000;           return `             <div class="${mine ? 'items-end' : 'items-start'} flex flex-col gap-1">               ${showTime ? `<span class="text-[11px] text-slate-400">${formatRelativeTime(m.timestamp)}</span>` : ''}               <div class="max-w-[85%] rounded-2xl px-3 py-2 text-sm shadow-sm ${mine ? 'bg-emerald-600 text-white' : 'bg-white text-slate-800'} ${m._optimistic ? 'opacity-70' : ''}">                 ${escapeHtml(m.content || '')}               </div>             </div>`;         }).join('');          ui.sendBtn.disabled = false;         requestAnimationFrame(() => {           ui.messagesWrap.scrollTop = ui.messagesWrap.scrollHeight;         });       }        function upsertConversation(update) {         const idx = state.conversations.findIndex((c) => Number(c.id) === Number(update.id));         if (idx >= 0) {           state.conversations[idx] = { ...state.conversations[idx], ...update };         } else {           state.conversations.unshift(update);         }         sortConversations();         subscribeConversationMessages(update.id);       }        function upsertMessage(convId, message) {         const key = Number(convId);         const current = state.messagesByConversation.get(key) || [];          const byId = message.id != null           ? current.findIndex((m) => m.id != null && Number(m.id) === Number(message.id))           : -1;          const byTemp = byId < 0 && message.clientTempId           ? current.findIndex((m) => m.clientTempId && m.clientTempId === message.clientTempId)           : -1;          if (byId >= 0) {           current[byId] = { ...current[byId], ...message, _optimistic: false };         } else if (byTemp >= 0) {           current[byTemp] = { ...current[byTemp], ...message, _optimistic: false };         } else {           current.push({ ...message, _optimistic: false });         }          current.sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());         state.messagesByConversation.set(key, current);       }        async function loadMe() {         const me = await fetchJson(profileLitePath);         state.me = me;         state.role = (me.role || 'UNKNOWN').toUpperCase();       }        async function loadConversations() {         const list = await api('/chat/conversations');         state.conversations = Array.isArray(list) ? list : [];         sortConversations();       }        async function loadContacts(query = '') {         const hasQuery = query.trim().length >= 2;         const suffix = hasQuery ? `?q=${encodeURIComponent(query.trim())}` : '';         const list = await api(`/chat/contacts${suffix}`);         const contacts = Array.isArray(list) ? list.filter((c) => Number(c.id) !== Number(state.me.id)) : [];          if (hasQuery) {           state.contacts = contacts;           return;         }          state.defaultContacts = contacts;         state.contacts = contacts;         if (state.role === 'ADMIN') {           state.isAdminFullAccess = contacts.some((c) => (c.kind || '').toUpperCase() === 'GROUP')             || contacts.some((c) => (c.role || '').toUpperCase() !== 'ADMIN');         }       }        function subscribeConversationMessages(conversationId) {         if (!state.stompClient) return;         const key = Number(conversationId);         if (state.messageSubs.has(key)) return;          const sub = state.stompClient.subscribe(`/topic/messages/${key}`, (frame) => {           if (!frame.body) return;           const msg = JSON.parse(frame.body);           upsertMessage(key, msg);            const conversation = state.conversations.find((c) => Number(c.id) === key);           if (conversation) {             conversation.lastMessage = msg.content || '';             conversation.lastMessageAt = msg.timestamp;             conversation.updatedAt = msg.timestamp;              if (Number(state.activeConversationId) !== key && Number(msg.senderId) !== Number(state.me.id)) {               conversation.unreadCount = Number(conversation.unreadCount || 0) + 1;             }           }            sortConversations();           renderDirectory();           if (Number(state.activeConversationId) === key) {             renderMessages();           }         });          state.messageSubs.set(key, sub);       }        function connectRealtime() {         if (!window.SockJS || !window.Stomp) {           setStatus('Realtime library unavailable', true);           return;         }          try {           const socket = new SockJS(wsPath);           const client = window.Stomp.over(socket);           client.debug = null;            const token = localStorage.getItem('JWT_TOKEN') || localStorage.getItem('access_token') || localStorage.getItem('accessToken');           const connectHeaders = token             ? { Authorization: token.startsWith('Bearer ') ? token : `Bearer ${token}` }             : {};            client.connect(connectHeaders, () => {             state.stompClient = client;             setStatus('Realtime connected');              if (state.conversationSub) {               state.conversationSub.unsubscribe();             }             state.conversationSub = client.subscribe(`/topic/conversations/${state.me.id}`, (frame) => {               if (!frame.body) return;               const summary = JSON.parse(frame.body);               upsertConversation(summary);               renderDirectory();             });              state.conversations.forEach((conv) => subscribeConversationMessages(conv.id));           }, (err) => {             setStatus('Realtime disconnected', true);             console.error(err);           });         } catch (err) {           setStatus('Realtime connection failed', true);           console.error(err);         }       }        async function openConversation(conversationId, fetchMessages = true) {         state.activeConversationId = Number(conversationId);         updatePanels();         renderDirectory();          if (!fetchMessages) {           renderMessages();           return;         }          ui.messagesList.innerHTML = '<div class="text-center text-sm text-slate-500">Loading messages...</div>';         try {           const messages = await api(`/chat/conversations/${conversationId}/messages`);           const list = Array.isArray(messages) ? messages : [];           state.messagesByConversation.set(Number(conversationId), list);           subscribeConversationMessages(conversationId);           renderMessages();            await api(`/chat/conversations/${conversationId}/read`, {             method: 'PUT',             headers: { 'Content-Type': 'application/json' },             body: JSON.stringify({})           });            const conv = state.conversations.find((c) => Number(c.id) === Number(conversationId));           if (conv) conv.unreadCount = 0;           renderDirectory();         } catch (err) {           ui.messagesList.innerHTML = `<div class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">${escapeHtml(err.message)}</div>`;         }       }        async function openContact(contactId, kind) {         const contact = state.contacts.find((c) => Number(c.id) === Number(contactId));         if (!contact) return;          try {           if ((kind || '').toUpperCase() === 'GROUP') {             if (!contact.conversationId) throw new Error('Group conversation is missing');             await openConversation(contact.conversationId, true);             return;           }            const res = await api('/chat/conversations/direct', {             method: 'POST',             headers: { 'Content-Type': 'application/json' },             body: JSON.stringify({ otherUserId: contact.id })           });            const conversationId = Number(res.conversationId);           if (!conversationId) throw new Error('Failed to open direct conversation');            await loadConversations();           state.conversations.forEach((conv) => subscribeConversationMessages(conv.id));           renderDirectory();           await openConversation(conversationId, true);         } catch (err) {           setStatus(err.message || 'Failed to open contact', true);         }       }        function clientTempId() {         if (window.crypto && window.crypto.randomUUID) {           return `tmp_${window.crypto.randomUUID()}`;         }         return `tmp_${Date.now()}_${Math.floor(Math.random() * 100000)}`;       }        async function sendMessage() {         const text = ui.messageInput.value.trim();         if (!text || !state.activeConversationId) return;          const conversation = state.conversations.find((c) => Number(c.id) === Number(state.activeConversationId));         if (!conversation) return;          const tempId = clientTempId();         const optimistic = {           id: null,           conversationId: state.activeConversationId,           senderId: state.me.id,           receiverId: null,           content: text,           timestamp: new Date().toISOString(),           read: true,           clientTempId: tempId,           _optimistic: true         };          const list = state.messagesByConversation.get(state.activeConversationId) || [];         list.push(optimistic);         state.messagesByConversation.set(state.activeConversationId, list);          conversation.lastMessage = text;         conversation.lastMessageAt = optimistic.timestamp;         conversation.updatedAt = optimistic.timestamp;         sortConversations();          ui.messageInput.value = '';         renderDirectory();         renderMessages();          let receiverId = null;         if (Array.isArray(conversation.participants) && conversation.participants.length === 2) {           const other = conversation.participants.find((p) => Number(p.id) !== Number(state.me.id));           receiverId = other ? Number(other.id) : null;         }          try {           await api(`/chat/conversations/${state.activeConversationId}/messages`, {             method: 'POST',             headers: { 'Content-Type': 'application/json' },             body: JSON.stringify({               senderId: Number(state.me.id),               receiverId,               content: text,               clientTempId: tempId             })           });         } catch (err) {           setStatus(err.message || 'Message send failed', true);         }       }        function bindEvents() {         ui.tabConversations.addEventListener('click', () => {           state.activeTab = 'conversations';           state.search = '';           ui.directorySearch.value = '';           ui.directorySearch.placeholder = 'Search conversations';           renderDirectory();         });          ui.tabContacts.addEventListener('click', () => {           state.activeTab = 'contacts';           state.search = '';           ui.directorySearch.value = '';           ui.directorySearch.placeholder = 'Search contacts';           state.contacts = state.defaultContacts;           renderDirectory();         });          ui.directorySearch.addEventListener('input', async (event) => {           state.search = event.target.value || '';            if (state.activeTab === 'conversations') {             renderDirectory();             return;           }            if (state.searchTimer) clearTimeout(state.searchTimer);           state.searchTimer = setTimeout(async () => {             try {               if (state.search.trim().length >= 2) {                 await loadContacts(state.search);               } else {                 state.contacts = state.defaultContacts;               }               renderDirectory();             } catch (err) {               setStatus(err.message || 'Search failed', true);             }           }, 250);         });          ui.directoryList.addEventListener('click', (event) => {           const convButton = event.target.closest('[data-open-conv]');           if (convButton) {             openConversation(Number(convButton.dataset.openConv), true);             return;           }            const contactButton = event.target.closest('[data-open-contact]');           if (contactButton) {             openContact(Number(contactButton.dataset.openContact), contactButton.dataset.kind || 'USER');           }         });          ui.composerForm.addEventListener('submit', async (event) => {           event.preventDefault();           await sendMessage();         });          ui.mobileBackBtn.addEventListener('click', () => {           state.activeConversationId = null;           renderMessages();           updatePanels();           renderDirectory();         });          window.addEventListener('resize', updatePanels);       }        async function bootstrap() {         bindEvents();         updatePanels();          try {           await loadMe();           await Promise.all([loadContacts(''), loadConversations()]);            updateRolePanel();           ui.directorySearch.placeholder = 'Search conversations';           renderDirectory();           renderMessages();            connectRealtime();           state.conversations.forEach((conv) => subscribeConversationMessages(conv.id));            if (state.conversations.length > 0 && !isMobile()) {             await openConversation(state.conversations[0].id, true);           }         } catch (err) {           setStatus(err.message || 'Failed to load chat', true);           ui.directoryList.innerHTML = `<div class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">${escapeHtml(err.message || 'Unable to initialize chat.')}</div>`;           ui.messagesList.innerHTML = '<div class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">Chat is unavailable right now.</div>';         }       }        bootstrap();     })();   </script> </body> </html>
